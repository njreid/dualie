[package]
name        = "capshift"
version     = "0.2.0"
edition     = "2021"
description = "Caps-lock chord shortcut daemon for macOS — app launch/focus and key remaps"
license     = "GPL-3.0"

[[bin]]
name = "capshift"
path = "src/main.rs"

[dependencies]
tokio  = { workspace = true }
anyhow = { workspace = true }

tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

clap = { version = "4", features = ["derive"] }
kdl  = { version = "6" }

# Use macOS FSEvents rather than notify's kqueue backend. FSEvents watches the
# containing directory, so atomic editor saves are handled without polling.
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
tokio-test = { version = "0.4" }
